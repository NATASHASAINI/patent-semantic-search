apiVersion: apps/v1
kind: Deployment
metadata:
  name: patent-semantic-search
  labels:
    app: patent-search
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patent-search
  template:
    metadata:
      labels:
        app: patent-search
    spec:
      containers:
        - name: fastapi-app
          image: natashasaini/patent-semantic-search:latest
          ports:
            - containerPort: 8000

          # Optional but recommended
          env:
            - name: ENV
              value: "production"

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
